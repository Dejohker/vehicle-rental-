{% if not user.is_staff and vehicle.active %}
  {% if user.is_authenticated %}
    {% if vehicle.pk in saved_vehicle_ids %}<a class="btn btn-primary w-100" href="{% url 'dashboard:cart' %}">View in cart →</a>
    {% else %}<form method="post" action="{% url 'vehicles:add_to_cart' vehicle.pk %}">{% csrf_token %}<button type="submit" class="btn btn-primary w-100">Add to cart <span aria-hidden="true">+</span></button></form>{% endif %}
  {% else %}<a class="btn btn-primary w-100" href="{% url 'accounts:login' %}?next={{ vehicle.get_absolute_url|urlencode }}">Sign in to add to cart</a>{% endif %}
{% endif %}
