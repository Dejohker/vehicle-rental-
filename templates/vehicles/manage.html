{% extends 'base.html' %}{% block content %}<div class="container page-section"><div class="d-flex justify-content-between"><h1>Manage vehicles</h1><a class="btn btn-primary" href="{% url 'vehicles:add' %}">Add vehicle</a></div><div class="table-responsive mt-4"><table class="table align-middle"><thead><tr><th>Vehicle</th><th>Registration</th><th>Status</th><th>Price/day</th><th></th></tr></thead><tbody>{% for v in vehicles %}<tr><td>{{ v }}</td><td>{{ v.registration_number }}</td><td><span class="badge bg-secondary">{{ v.get_status_display }}</span></td><td>₦{{ v.price_per_day }}</td><td><a href="{% url 'vehicles:edit' v.id %}">Edit</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
