{% extends 'base.html' %}{% block content %}<div class="container page-section"><h1>Customers</h1><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.get_full_name|default:'—' }}</td><td>{{ c.username }}</td><td>{{ c.email }}</td><td>{{ c.profile.phone_number }}</td><td>{{ c.date_joined|date:'M j, Y' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
