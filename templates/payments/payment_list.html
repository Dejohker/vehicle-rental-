{% extends 'base.html' %}{% block content %}<div class="container page-section"><div class="d-flex justify-content-between"><h1>Payments</h1><a class="btn btn-primary" href="{% url 'payments:create' %}">Record payment</a></div><table class="table mt-4"><thead><tr><th>Reference</th><th>Booking</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>{% for p in payments %}<tr><td><a href="{% url 'payments:detail' p.id %}">{{ p.transaction_reference }}</a></td><td>{{ p.booking }}</td><td>{{ p.customer }}</td><td>₦{{ p.amount }}</td><td>{{ p.get_payment_status_display }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
