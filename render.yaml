services:
  - type: web
    name: rideflow
    runtime: python
    region: ohio
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rideflow-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SEED_DEMO_FLEET
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: rideflow-db
    region: ohio
    plan: free
    databaseName: rideflow
    user: rideflow
